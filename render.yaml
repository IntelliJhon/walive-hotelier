# Render blueprint (free plans, Singapore): API + booking web app + Postgres.
# Render dashboard -> New -> Blueprint -> pick this repo.
# On first deploy Render asks for PMS_BASE_URL, PMS_KEY, PMS_GROUP_ID and N8N_NOTIFY_URL.
# CHAT_API_SECRET and ADMIN_PASSWORD are generated; copy CHAT_API_SECRET into the n8n
# "WALIVE API secret" credential after the first deploy.
#
# Free-plan notes: the API sleeps after 15 min without traffic (the n8n workflow pings /health
# every 10 min to keep it awake); free Postgres is deleted after 30 days. Unpaid room holds are
# released by the API itself every minute, so no cron service is needed.
services:
  - type: web
    name: walive-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w api
    startCommand: npm run migrate:deploy -w api && npm run start -w api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: walive-db
          property: connectionString
      # Supplied by Hotelier / your n8n
      - key: PMS_BASE_URL
        sync: false
      - key: PMS_KEY
        sync: false
      - key: PMS_GROUP_ID
        sync: false
      - key: N8N_NOTIFY_URL
        sync: false
      - key: PMS_SOURCE
        value: WALIVE
      - key: PMS_RATE_TYPE
        value: ""
      - key: CHECKIN_TIME
        value: "12:00"
      - key: CHECKOUT_TIME
        value: "11:00"
      - key: SESSION_MINUTES
        value: "30"
      - key: HOLD_MINUTES
        value: "15"
      - key: PAYMENT_MODE
        value: test
      - key: CHAT_API_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      # Public URL of the booking web app; change both if Render gives walive-book a different subdomain.
      - key: WEB_BASE_URL
        value: https://walive-book.onrender.com
      - key: CORS_ORIGINS
        value: https://walive-book.onrender.com

  - type: web
    name: walive-book
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w web
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL of walive-api (change if Render assigns a different subdomain)
      - key: VITE_API_URL
        value: https://walive-api.onrender.com

databases:
  - name: walive-db
    region: singapore
    plan: free
    databaseName: walive
    user: walive
